[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spjazi-chartnum"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出图表与文字的数值一致性上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "spjazi" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://spjazi.github.io"
Repository = "https://github.com/spjazi/chartnum"
Issues = "https://github.com/spjazi/chartnum/issues"

[project.scripts]
chartnum = "chartnum:main"

[tool.setuptools]
py-modules = ["chartnum"]
